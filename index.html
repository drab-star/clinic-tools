<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI in Practice — Clinic Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --teal:#0E7C7B; --teal-700:#0b605f; --teal-900:#083e3d;
    --mint:#e3f1ee; --mint-2:#eef7f4;
    --ink:#132029; --ink-2:#3a4a55; --muted:#6b7b87;
    --bg:#f3f6f4; --card:#ffffff; --line:#e7edea;
    --c-what:#0e7c7b; --b-what:#e2f0ef;
    --c-why:#0f766e;  --b-why:#e3f2ee;
    --c-risk:#b45309; --b-risk:#fbeedd;
    --c-alt:#1d4ed8;  --b-alt:#e8effd;
    --c-rec:#7c3aed;  --b-rec:#f1ebfd;
    --c-sut:#0369a1;  --b-sut:#e1f0fa;
    --c-wis:#4338ca;  --b-wis:#e9eafb;
    --c-la:#b45309;   --b-la:#fcefd6;
    --shadow-sm:0 1px 2px rgba(19,32,41,.05);
    --shadow:0 2px 6px rgba(19,32,41,.05),0 14px 34px rgba(19,32,41,.07);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter','Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6;
  }
  h1,h2,h3,.jak{font-family:'Plus Jakarta Sans','Noto Sans Devanagari',sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:0 22px}

  /* HERO */
  header.site{
    position:relative;overflow:hidden;color:#fff;padding:26px 0 30px;
    background:radial-gradient(120% 140% at 15% -10%,#12908d 0%,var(--teal) 42%,var(--teal-900) 100%);
  }
  header.site::after{content:"";position:absolute;right:-80px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.06)}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:13px}
  .logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:-.5px;border:1px solid rgba(255,255,255,.28);font-family:'Plus Jakarta Sans',sans-serif}
  .brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
  .brand p{margin:2px 0 0;font-size:12.5px;opacity:.82;font-weight:400}
  .langtoggle{display:flex;background:rgba(255,255,255,.14);border-radius:11px;padding:3px;border:1px solid rgba(255,255,255,.22)}
  .langtoggle button{border:0;background:transparent;color:#fff;font-family:inherit;font-size:13px;font-weight:600;padding:7px 15px;border-radius:8px;cursor:pointer;opacity:.72;transition:.15s}
  .langtoggle button.active{background:#fff;color:var(--teal-900);opacity:1}
  .herotag{position:relative;z-index:1;margin:20px 0 0;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:23px;letter-spacing:-.5px;max-width:560px;line-height:1.25}
  .herotag span{color:#bff0e7}

  /* TAB BAR (sticky) */
  .tabbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line)}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:9px 0}
  nav.tabs button{
    border:0;background:transparent;color:var(--muted);font-family:'Plus Jakarta Sans',sans-serif;
    font-size:13.5px;font-weight:700;padding:9px 15px;cursor:pointer;white-space:nowrap;border-radius:11px;
    display:inline-flex;align-items:center;gap:8px;transition:.15s;
  }
  nav.tabs button svg{width:16px;height:16px}
  nav.tabs button:hover{background:var(--mint-2);color:var(--teal-700)}
  nav.tabs button.active{background:var(--teal);color:#fff}
  nav.tabs button .soon{font-size:9.5px;font-weight:800;background:rgba(0,0,0,.08);padding:2px 6px;border-radius:20px;letter-spacing:.4px}
  nav.tabs button.active .soon{background:rgba(255,255,255,.25)}

  main{padding:26px 0 64px}
  .panel{display:none;animation:fade .28s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  .lead{font-size:15.5px;color:var(--ink-2);max-width:640px;margin:2px 0 20px}
  .lead b{color:var(--ink);font-weight:600}

  .disclaimer{background:#fffaf0;border:1px solid #f6e0b0;color:#8a5a10;border-radius:14px;padding:13px 16px;font-size:13px;margin-bottom:24px;display:flex;gap:11px;align-items:flex-start}
  .disclaimer svg{flex-shrink:0;margin-top:1px;color:#c98a1e}
  .disclaimer b{color:#6f460a}

  .section-label{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:0 0 13px;font-family:'Plus Jakarta Sans',sans-serif}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px}
  .proc-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 17px 16px;cursor:pointer;
    text-align:left;font-family:inherit;transition:.18s;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:2px;position:relative;
  }
  .proc-card:hover{border-color:transparent;box-shadow:var(--shadow);transform:translateY(-3px)}
  .proc-card .badge{width:44px;height:44px;border-radius:13px;background:var(--mint);color:var(--teal);display:grid;place-items:center;margin-bottom:11px}
  .proc-card .badge svg{width:25px;height:25px}
  .proc-card .nm{font-weight:700;font-size:15px;color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif}
  .proc-card .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .proc-card .go{position:absolute;top:18px;right:16px;color:var(--line);transition:.18s}
  .proc-card:hover .go{color:var(--teal);transform:translateX(3px)}

  .explainer{display:none}
  .explainer.active{display:block}
  .back{background:none;border:0;color:var(--teal-700);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;padding:6px 0;margin-bottom:10px;display:inline-flex;align-items:center;gap:6px}
  .back:hover{color:var(--teal-900)}
  .proc-head{display:flex;align-items:center;gap:14px;margin:2px 0 22px}
  .proc-head .badge{width:52px;height:52px;border-radius:15px;background:var(--mint);color:var(--teal);display:grid;place-items:center;flex-shrink:0}
  .proc-head .badge svg{width:29px;height:29px}
  .proc-title{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:0}

  .infocard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
  .infocard h3{margin:0;padding:15px 18px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:11px;font-family:'Plus Jakarta Sans',sans-serif}
  .infocard .body{padding:2px 18px 18px;font-size:14.5px;color:var(--ink-2)}
  .infocard .body p{margin:0}
  .infocard ul{margin:2px 0 0;padding-left:6px;list-style:none}
  .infocard li{position:relative;padding-left:20px;margin-bottom:8px}
  .infocard li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
  .tag{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
  .tag svg{width:17px;height:17px}
  /* tinted variants */
  .v-what .tag{background:var(--b-what);color:var(--c-what)} .v-what h3{color:var(--c-what)} .v-what li{color:var(--c-what)}
  .v-why .tag{background:var(--b-why);color:var(--c-why)} .v-why h3{color:var(--c-why)}
  .v-risk{border-color:#f3ddc2} .v-risk h3{background:var(--b-risk);color:var(--c-risk);border-bottom:1px solid #f3ddc2} .v-risk .tag{background:#fff;color:var(--c-risk)} .v-risk li{color:var(--c-risk)}
  .v-alt .tag{background:var(--b-alt);color:var(--c-alt)} .v-alt h3{color:var(--c-alt)} .v-alt li{color:var(--c-alt)}
  .v-rec .tag{background:var(--b-rec);color:var(--c-rec)} .v-rec h3{color:var(--c-rec)}
  .v-sut .tag{background:var(--b-sut);color:var(--c-sut)} .v-sut h3{color:var(--c-sut)}
  .v-wis{border-color:#dcdcf6} .v-wis h3{background:var(--b-wis);color:var(--c-wis);border-bottom:1px solid #dcdcf6} .v-wis .tag{background:#fff;color:var(--c-wis)} .v-wis li{color:var(--c-wis)}
  .v-la{border-color:#f3e2bd} .v-la h3{background:var(--b-la);color:var(--c-la);border-bottom:1px solid #f3e2bd} .v-la .tag{background:#fff;color:var(--c-la)} .v-la li{color:var(--c-la)}
  .infocard li b{color:var(--ink)}

  /* CHECK / progress */
  .check{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:24px}
  .check h3{margin:0 0 3px;font-size:17px;font-family:'Plus Jakarta Sans',sans-serif}
  .check .hint{font-size:13px;color:var(--muted);margin:0 0 16px}
  .prog{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .prog .track{flex:1;height:8px;border-radius:99px;background:var(--mint);overflow:hidden}
  .prog .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),#18a39c);transition:width .3s ease}
  .prog .ptxt{font-size:12.5px;font-weight:700;color:var(--teal-700);font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}
  .checkitem{display:flex;gap:12px;align-items:flex-start;padding:12px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;transition:.14s}
  .checkitem:hover{background:var(--mint-2)}
  .checkitem.done{background:var(--mint-2);border-color:#bfe4dd}
  .checkitem input{margin-top:2px;width:18px;height:18px;accent-color:var(--teal);flex-shrink:0}
  .checkitem span{font-size:14px}
  .qbox{width:100%;margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-family:inherit;font-size:14px;resize:vertical;min-height:70px;background:#fcfdfd}
  .qbox:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,123,.13)}
  .summary{margin-top:16px;padding:16px 18px;border-radius:14px;background:linear-gradient(120deg,var(--mint-2),var(--mint));border:1px solid #bfe4dd;font-size:14px;display:none;align-items:flex-start;gap:12px}
  .summary.show{display:flex;animation:fade .3s}
  .summary svg{flex-shrink:0;color:var(--teal);margin-top:1px}
  .summary b{color:var(--teal-900)}

  .soon-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:52px 30px;text-align:center;box-shadow:var(--shadow-sm)}
  .soon-panel .ic{width:64px;height:64px;border-radius:18px;background:var(--mint);color:var(--teal);display:grid;place-items:center;margin:0 auto 16px}
  .soon-panel .ic svg{width:34px;height:34px}
  .soon-panel h2{margin:0 0 8px;font-size:21px}
  .soon-panel p{color:var(--muted);font-size:14.5px;max-width:470px;margin:0 auto;line-height:1.6}
  .roadmap{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2)}

  footer{border-top:1px solid var(--line);padding:26px 0;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.6}
  .hidden{display:none!important}
  @media(max-width:560px){.herotag{font-size:20px}.proc-title{font-size:22px}.brand p{display:none}.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:400px){.grid{grid-template-columns:1fr}}
  .langpick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 20px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
  .langpick .lbl{font-family:'Plus Jakarta Sans','Noto Sans Devanagari','Noto Sans Gurmukhi',sans-serif;font-weight:700;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:9px}
  .langpick .lbl svg{width:18px;height:18px;color:var(--teal)}
  .langpick .selectwrap{position:relative;margin-left:auto}
  .langpick select{appearance:none;-webkit-appearance:none;font-family:'Inter','Noto Sans Devanagari','Noto Sans Gurmukhi',sans-serif;font-size:14px;font-weight:600;color:var(--ink);background:var(--mint-2);border:1px solid #cfe6e0;border-radius:10px;padding:9px 40px 9px 15px;cursor:pointer}
  .langpick select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,123,.13)}
  .langpick .selectwrap::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--teal-700);border-bottom:2px solid var(--teal-700);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .signcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:16px}
  .signcard h3{margin:0 0 14px;font-size:17px;font-family:'Plus Jakarta Sans','Noto Sans Devanagari','Noto Sans Gurmukhi',sans-serif}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;font-family:'Plus Jakarta Sans','Noto Sans Devanagari','Noto Sans Gurmukhi',sans-serif}
  .field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-family:inherit;font-size:15px;background:#fcfdfd}
  .field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,123,.13)}
  .field .hint{margin:0 0 8px}
  .sigwrap{position:relative}
  .sigpad{width:100%;height:180px;border:1.5px dashed #cfe0dc;border-radius:12px;background:#fbfdfc;touch-action:none;display:block;cursor:crosshair}
  .sigpad.signed{border-style:solid;border-color:var(--accent)}
  .sigrow{display:flex;justify-content:flex-end;margin-top:8px}
  .clearbtn{background:none;border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .clearbtn:hover{background:var(--mint-2);color:var(--teal-700)}
  .submitbtn{width:100%;margin-top:18px;border:0;border-radius:12px;padding:15px;font-family:'Plus Jakarta Sans','Noto Sans Devanagari','Noto Sans Gurmukhi',sans-serif;font-size:16px;font-weight:800;color:#fff;background:var(--teal);cursor:pointer;transition:.15s}
  .submitbtn:disabled{background:#b9cdca;cursor:not-allowed}
  .submitbtn:not(:disabled):hover{background:var(--teal-700)}
  .subnote{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
  .gatehint{font-size:12.5px;color:var(--risk);margin-top:9px;text-align:center;display:none}
  .gatehint.show{display:block}
  .donecard{background:linear-gradient(120deg,var(--mint-2),var(--mint));border:1px solid #bfe4dd;border-radius:var(--radius);padding:36px 24px;text-align:center;display:none;margin-top:16px}
  .donecard.show{display:block;animation:fade .3s}
  .donecard .big{width:60px;height:60px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
  .donecard .big svg{width:32px;height:32px}
  .donecard h3{margin:0 0 6px;font-size:20px}
  .donecard p{color:var(--ink-2);font-size:14.5px;margin:0}
  .qrecap{background:#fbfaf3;border:1px solid #f0e6c8;border-radius:12px;padding:13px 15px;margin-bottom:16px}
  .qrecap h4{margin:0 0 7px;font-size:13.5px;font-weight:700;color:#8a5a10;font-family:'Plus Jakarta Sans','Noto Sans Devanagari','Noto Sans Gurmukhi',sans-serif}
  .qrecap ul{margin:0;padding-left:18px}
  .qrecap li{font-size:13.5px;color:#5a4a20;margin-bottom:4px}
  .qrecap .note{margin:9px 0 0;font-size:12px;color:#8a7a45}
  #pdfDoc{position:fixed;left:-99999px;top:0;width:720px;background:#fff;color:#14212b;font-family:'Inter','Noto Sans Devanagari','Noto Sans Gurmukhi',sans-serif;padding:44px 44px 52px}
</style>
</head>
<body class="lang-en">
<header class="site">
  <div class="wrap">
    <div class="brandrow">
      <div class="brand">
        <div class="logo">AiP</div>
        <div>
          <h1>AI in Practice</h1>
          <p>Practical AI tools for the modern clinic</p>
        </div>
      </div>
    </div>
    <p class="herotag" data-en="Tools to help you <span>run tomorrow's clinic, today.</span>" data-hi="कल का क्लिनिक <span>आज चलाने</span> में मदद करने वाले टूल।" data-pa="ਤੁਹਾਡੀ ਮਦਦ ਲਈ ਟੂਲ — <span>ਕੱਲ੍ਹ ਦਾ ਕਲੀਨਿਕ, ਅੱਜ ਚਲਾਓ।</span>"></p>
  </div>
</header>
<div class="tabbar">
  <div class="wrap">
    <nav class="tabs" id="tabs">
      <button data-tab="consent" data-mode="read" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6M9 16h4M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 3v3h6V3"/></svg>Consent Explainer</button>
      <button data-tab="consent" data-mode="sign"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Sign Consent</button>
      <button data-tab="perio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M6 7v10M18 7v10M4 17h16M9 7v10M14 7v10"/></svg>Perio Chart<span class="soon">SOON</span></button>
      <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>More Tools<span class="soon">SOON</span></button>
    </nav>
  </div>
</div>

<main>
  <div class="wrap">

    <section class="panel active" id="panel-consent">

         hi:["फिक्स्ड ब्रिज (दोनों तरफ के दाँतों का सहारा लेकर)","निकालने-लगाने वाला डेंचर","गैप को वैसे ही छोड़ देना"],
         pa:["ਫਿਕਸਡ ਬ੍ਰਿਜ (ਦੋਵੇਂ ਪਾਸੇ ਦੇ ਦੰਦਾਂ ਦਾ ਸਹਾਰਾ ਲੈ ਕੇ)","ਕੱਢਣ-ਲਗਾਉਣ ਵਾਲਾ ਡੈਂਚਰ","ਖਾਲੀ ਥਾਂ ਨੂੰ ਉਵੇਂ ਹੀ ਛੱਡਣਾ"]},
    rec:{en:"Expect mild swelling and soreness for a few days and stick to soft food. The bone usually takes 3 to 6 months to heal fully before the final crown goes on. Keep the area clean and follow the aftercare instructions.",
         hi:"कुछ दिनों तक हल्की सूजन और दर्द रह सकता है, इसलिए नरम भोजन लें। अंतिम क्राउन लगने से पहले हड्डी को पूरी तरह ठीक होने में आमतौर पर 3 से 6 महीने लगते हैं। जगह को साफ़ रखें और देखभाल के निर्देशों का पालन करें।",
         pa:"ਕੁਝ ਦਿਨ ਹਲਕੀ ਸੋਜ ਅਤੇ ਦਰਦ ਰਹਿ ਸਕਦਾ ਹੈ, ਇਸ ਲਈ ਨਰਮ ਭੋਜਨ ਲਓ। ਅੰਤਿਮ ਕ੍ਰਾਊਨ ਲੱਗਣ ਤੋਂ ਪਹਿਲਾਂ ਹੱਡੀ ਨੂੰ ਪੂਰੀ ਤਰ੍ਹਾਂ ਠੀਕ ਹੋਣ ਵਿੱਚ ਆਮ ਤੌਰ ਤੇ 3 ਤੋਂ 6 ਮਹੀਨੇ ਲੱਗਦੇ ਹਨ। ਥਾਂ ਨੂੰ ਸਾਫ਼ ਰੱਖੋ ਅਤੇ ਦੇਖਭਾਲ ਦੀਆਂ ਹਦਾਇਤਾਂ ਦੀ ਪਾਲਣਾ ਕਰੋ।"},
    sutures:{en:"Stitches are often placed at the surgery site. They're usually removed at a quick follow-up about 7 to 10 days later — unless they're the dissolving type that goes on its own. Your doctor will tell you which.",
             hi:"सर्जरी वाली जगह पर अक्सर टाँके लगाए जाते हैं। इन्हें आमतौर पर करीब 7 से 10 दिन बाद एक छोटी फ़ॉलो-अप विज़िट में हटाया जाता है — जब तक कि वे अपने-आप घुलने वाले न हों। डॉक्टर आपको बता देंगे कि कौन-से हैं।",
             pa:"ਸਰਜਰੀ ਵਾਲੀ ਥਾਂ ਤੇ ਅਕਸਰ ਟਾਂਕੇ ਲਗਾਏ ਜਾਂਦੇ ਹਨ। ਇਹਨਾਂ ਨੂੰ ਆਮ ਤੌਰ ਤੇ ਲਗਭਗ 7 ਤੋਂ 10 ਦਿਨ ਬਾਅਦ ਇੱਕ ਛੋਟੀ ਫਾਲੋ-ਅੱਪ ਮੁਲਾਕਾਤ ਵਿੱਚ ਹਟਾਇਆ ਜਾਂਦਾ ਹੈ — ਜਦੋਂ ਤੱਕ ਕਿ ਉਹ ਆਪਣੇ-ਆਪ ਘੁਲਣ ਵਾਲੇ ਨਾ ਹੋਣ। ਤੁਹਾਡਾ ਡਾਕਟਰ ਦੱਸ ਦੇਵੇਗਾ ਕਿ ਕਿਹੜੇ ਹਨ।"}

  {
    id:"rct", icon:"🩹",
    name:{en:"Root Canal", hi:"रूट कैनाल", pa:"ਰੂਟ ਕੈਨਾਲ"},
    sub:{en:"Save an infected tooth", hi:"संक्रमित दाँत बचाना", pa:"ਲਾਗ ਵਾਲਾ ਦੰਦ ਬਚਾਓ"},
    what:{en:"The infected or inflamed soft tissue (the 'nerve') inside the tooth is cleaned out, and the space is disinfected and sealed. This saves the natural tooth instead of removing it.",
          hi:"दाँत के अंदर की संक्रमित या सूजी हुई नस को साफ़ किया जाता है, और उस जगह को कीटाणुरहित करके भर दिया जाता है। इससे दाँत निकालने के बजाय प्राकृतिक दाँत बच जाता है।",
          pa:"ਦੰਦ ਦੇ ਅੰਦਰ ਦੀ ਲਾਗ ਵਾਲੀ ਜਾਂ ਸੁੱਜੀ ਹੋਈ ਨਸ ਨੂੰ ਸਾਫ਼ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਉਸ ਥਾਂ ਨੂੰ ਕੀਟਾਣੂ-ਰਹਿਤ ਕਰਕੇ ਭਰ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ। ਇਸ ਨਾਲ ਦੰਦ ਕੱਢਣ ਦੀ ਬਜਾਏ ਕੁਦਰਤੀ ਦੰਦ ਬਚ ਜਾਂਦਾ ਹੈ।"},
    why:{en:"It relieves the pain caused by deep decay or infection and lets you keep your own tooth, which is almost always better than losing it.",
         hi:"यह गहरी सड़न या संक्रमण से होने वाले दर्द को दूर करता है और आपको अपना दाँत रखने देता है, जो लगभग हमेशा दाँत खोने से बेहतर होता है।",
         pa:"ਇਹ ਡੂੰਘੀ ਸੜਨ ਜਾਂ ਲਾਗ ਤੋਂ ਹੋਣ ਵਾਲੇ ਦਰਦ ਨੂੰ ਦੂਰ ਕਰਦਾ ਹੈ ਅਤੇ ਤੁਹਾਨੂੰ ਆਪਣਾ ਦੰਦ ਰੱਖਣ ਦਿੰਦਾ ਹੈ, ਜੋ ਲਗਭਗ ਹਮੇਸ਼ਾ ਦੰਦ ਗੁਆਉਣ ਨਾਲੋਂ ਬਿਹਤਰ ਹੁੰਦਾ ਹੈ।"},
    risks:{en:["Tenderness or soreness for a few days after","A possible flare-up of infection needing extra visits","The tooth becoming more brittle, so a crown is usually advised afterwards","Rarely, a fine instrument tip separating inside the canal","In some cases the treatment doesn't work and the tooth may need re-treatment or removal"],
           hi:["बाद में कुछ दिनों तक हल्का दर्द या कोमलता","संक्रमण दोबारा भड़कना, जिसके लिए और विज़िट लग सकती हैं","दाँत का कमज़ोर हो जाना, इसलिए आमतौर पर बाद में क्राउन लगाने की सलाह दी जाती है","बहुत कम मामलों में, कैनाल के अंदर बारीक उपकरण की नोक टूट जाना","कुछ मामलों में इलाज सफल न होना और दाँत का दोबारा इलाज या निकालना पड़ना"],
           pa:["ਬਾਅਦ ਵਿੱਚ ਕੁਝ ਦਿਨ ਹਲਕਾ ਦਰਦ ਜਾਂ ਕੋਮਲਤਾ","ਲਾਗ ਦਾ ਦੁਬਾਰਾ ਭੜਕਣਾ, ਜਿਸ ਲਈ ਹੋਰ ਮੁਲਾਕਾਤਾਂ ਲੱਗ ਸਕਦੀਆਂ ਹਨ","ਦੰਦ ਦਾ ਕਮਜ਼ੋਰ ਹੋ ਜਾਣਾ, ਇਸ ਲਈ ਆਮ ਤੌਰ ਤੇ ਬਾਅਦ ਵਿੱਚ ਕ੍ਰਾਊਨ ਲਗਾਉਣ ਦੀ ਸਲਾਹ ਦਿੱਤੀ ਜਾਂਦੀ ਹੈ","ਬਹੁਤ ਘੱਟ ਮਾਮਲਿਆਂ ਵਿੱਚ, ਕੈਨਾਲ ਦੇ ਅੰਦਰ ਬਰੀਕ ਔਜ਼ਾਰ ਦੀ ਨੋਕ ਟੁੱਟ ਜਾਣਾ","ਕੁਝ ਮਾਮਲਿਆਂ ਵਿੱਚ ਇਲਾਜ ਸਫ਼ਲ ਨਾ ਹੋਣਾ ਅਤੇ ਦੰਦ ਦਾ ਦੁਬਾਰਾ ਇਲਾਜ ਜਾਂ ਕੱਢਣਾ ਪੈਣਾ"]},
    alt:{en:["Removing the tooth, then replacing it with an implant, bridge or denture","Leaving it untreated — not advised, as the infection spreads and the pain returns"],
         hi:["दाँत निकालना, फिर उसकी जगह इम्प्लांट, ब्रिज या डेंचर लगाना","बिना इलाज छोड़ना — सलाह नहीं दी जाती, क्योंकि संक्रमण फैलता है और दर्द लौट आता है"],
         pa:["ਦੰਦ ਕੱਢਣਾ, ਫਿਰ ਉਸ ਦੀ ਥਾਂ ਇੰਪਲਾਂਟ, ਬ੍ਰਿਜ ਜਾਂ ਡੈਂਚਰ ਲਗਾਉਣਾ","ਬਿਨਾਂ ਇਲਾਜ ਛੱਡਣਾ — ਸਲਾਹ ਨਹੀਂ ਦਿੱਤੀ ਜਾਂਦੀ, ਕਿਉਂਕਿ ਲਾਗ ਫੈਲਦੀ ਹੈ ਅਤੇ ਦਰਦ ਵਾਪਸ ਆ ਜਾਂਦਾ ਹੈ"]},
    rec:{en:"You may feel tenderness for a few days — normal painkillers usually handle it. Avoid chewing hard on that tooth until the crown is placed. A crown is generally recommended afterwards to protect the tooth.",
         hi:"कुछ दिनों तक हल्का दर्द महसूस हो सकता है — सामान्य दर्दनिवारक आमतौर पर काफ़ी होते हैं। क्राउन लगने तक उस दाँत पर कड़ी चीज़ें न चबाएँ। दाँत की सुरक्षा के लिए बाद में आमतौर पर क्राउन की सलाह दी जाती है।",
         pa:"ਕੁਝ ਦਿਨ ਹਲਕਾ ਦਰਦ ਮਹਿਸੂਸ ਹੋ ਸਕਦਾ ਹੈ — ਆਮ ਦਰਦ-ਨਿਵਾਰਕ ਆਮ ਤੌਰ ਤੇ ਕਾਫ਼ੀ ਹੁੰਦੇ ਹਨ। ਕ੍ਰਾਊਨ ਲੱਗਣ ਤੱਕ ਉਸ ਦੰਦ ਤੇ ਸਖ਼ਤ ਚੀਜ਼ਾਂ ਨਾ ਚਬਾਓ। ਦੰਦ ਦੀ ਸੁਰੱਖਿਆ ਲਈ ਬਾਅਦ ਵਿੱਚ ਆਮ ਤੌਰ ਤੇ ਕ੍ਰਾਊਨ ਦੀ ਸਲਾਹ ਦਿੱਤੀ ਜਾਂਦੀ ਹੈ।"}

  {

    sub:{en:"Remove a tooth", hi:"दाँत हटाना", pa:"ਦੰਦ ਹਟਾਉਣਾ"},
    what:{en:"A tooth that can't be saved is removed. The area is numbed first, and afterwards you'll be given instructions to help it heal.",
          hi:"जो दाँत बचाया नहीं जा सकता उसे निकाल दिया जाता है। पहले उस जगह को सुन्न किया जाता है, और बाद में ठीक होने में मदद के लिए निर्देश दिए जाते हैं।",
          pa:"ਜੋ ਦੰਦ ਬਚਾਇਆ ਨਹੀਂ ਜਾ ਸਕਦਾ ਉਸ ਨੂੰ ਕੱਢ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ। ਪਹਿਲਾਂ ਉਸ ਥਾਂ ਨੂੰ ਸੁੰਨ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਠੀਕ ਹੋਣ ਵਿੱਚ ਮਦਦ ਲਈ ਹਦਾਇਤਾਂ ਦਿੱਤੀਆਂ ਜਾਂਦੀਆਂ ਹਨ।"},
    why:{en:"It's advised when a tooth is too badly decayed, infected, loosened by gum disease, broken, or crowding the others, and can't be repaired.",
         hi:"यह तब बताया जाता है जब दाँत बहुत ज़्यादा सड़ चुका हो, संक्रमित हो, मसूड़ों की बीमारी से ढीला हो, टूटा हो, या दूसरों पर भीड़ कर रहा हो और उसकी मरम्मत न हो सके।",
         pa:"ਇਹ ਉਦੋਂ ਦੱਸਿਆ ਜਾਂਦਾ ਹੈ ਜਦੋਂ ਦੰਦ ਬਹੁਤ ਜ਼ਿਆਦਾ ਸੜ ਚੁੱਕਾ ਹੋਵੇ, ਲਾਗ ਵਾਲਾ ਹੋਵੇ, ਮਸੂੜਿਆਂ ਦੀ ਬਿਮਾਰੀ ਨਾਲ ਢਿੱਲਾ ਹੋਵੇ, ਟੁੱਟਾ ਹੋਵੇ, ਜਾਂ ਦੂਜਿਆਂ ਤੇ ਭੀੜ ਕਰ ਰਿਹਾ ਹੋਵੇ ਅਤੇ ਉਸ ਦੀ ਮੁਰੰਮਤ ਨਾ ਹੋ ਸਕੇ।"},
    risks:{en:["Bleeding, swelling and soreness for a few days","'Dry socket' — a painful delay in healing if the clot is lost","Infection at the site","Temporary numbness of the lip or tongue for lower back teeth near a nerve","Rarely, injury to a neighbouring tooth or a small piece of root left behind"],
           hi:["कुछ दिनों तक खून आना, सूजन और दर्द","'ड्राई सॉकेट' — थक्का निकल जाने पर ठीक होने में दर्दभरी देरी","जगह पर संक्रमण","नस के पास वाले नीचे के पिछले दाँतों में होंठ या जीभ का अस्थायी सुन्नपन","बहुत कम, बगल के दाँत को चोट या जड़ का छोटा टुकड़ा रह जाना"],
           pa:["ਕੁਝ ਦਿਨ ਖ਼ੂਨ ਆਉਣਾ, ਸੋਜ ਅਤੇ ਦਰਦ","'ਡ੍ਰਾਈ ਸਾਕਟ' — ਥੱਕਾ ਨਿਕਲ ਜਾਣ ਤੇ ਠੀਕ ਹੋਣ ਵਿੱਚ ਦਰਦ ਭਰੀ ਦੇਰੀ","ਥਾਂ ਤੇ ਲਾਗ","ਨਸ ਦੇ ਨੇੜੇ ਵਾਲੇ ਹੇਠਲੇ ਪਿਛਲੇ ਦੰਦਾਂ ਵਿੱਚ ਬੁੱਲ੍ਹ ਜਾਂ ਜੀਭ ਦਾ ਅਸਥਾਈ ਸੁੰਨਪਨ","ਬਹੁਤ ਘੱਟ, ਨਾਲ ਦੇ ਦੰਦ ਨੂੰ ਸੱਟ ਜਾਂ ਜੜ੍ਹ ਦਾ ਛੋਟਾ ਟੁਕੜਾ ਰਹਿ ਜਾਣਾ"]},
    alt:{en:["Root canal and a crown, if the tooth can still be saved","Gum treatment, if looseness is due to gum disease","The best option depends on the specific tooth — the doctor will advise"],
         hi:["रूट कैनाल और क्राउन, अगर दाँत अभी बचाया जा सकता हो","मसूड़ों का इलाज, अगर ढीलापन मसूड़ों की बीमारी से हो","सबसे अच्छा विकल्प उस दाँत पर निर्भर करता है — डॉक्टर सलाह देंगे"],
         pa:["ਰੂਟ ਕੈਨਾਲ ਅਤੇ ਕ੍ਰਾਊਨ, ਜੇ ਦੰਦ ਹਾਲੇ ਬਚਾਇਆ ਜਾ ਸਕਦਾ ਹੋਵੇ","ਮਸੂੜਿਆਂ ਦਾ ਇਲਾਜ, ਜੇ ਢਿੱਲਾਪਨ ਮਸੂੜਿਆਂ ਦੀ ਬਿਮਾਰੀ ਕਾਰਨ ਹੋਵੇ","ਸਭ ਤੋਂ ਵਧੀਆ ਬਦਲ ਉਸ ਦੰਦ ਤੇ ਨਿਰਭਰ ਕਰਦਾ ਹੈ — ਡਾਕਟਰ ਸਲਾਹ ਦੇਵੇਗਾ"]},
    rec:{en:"Bite gently on the gauze pad to stop bleeding. For the first day, avoid rinsing hard, using straws, and smoking, as these can dislodge the clot. Stick to soft, cool foods. Swelling settles over a few days. Plan how the tooth will be replaced.",
         hi:"खून रोकने के लिए गॉज़ पर हल्के से दबाएँ। पहले दिन ज़ोर से कुल्ला करने, स्ट्रॉ इस्तेमाल करने और धूम्रपान से बचें, क्योंकि इससे थक्का हट सकता है। नरम, ठंडा भोजन लें। सूजन कुछ दिनों में कम हो जाती है। दाँत की जगह भरने की योजना बनाएँ।",
         pa:"ਖ਼ੂਨ ਰੋਕਣ ਲਈ ਗੌਜ਼ ਤੇ ਹਲਕਾ ਦਬਾਓ। ਪਹਿਲੇ ਦਿਨ ਜ਼ੋਰ ਨਾਲ ਕੁਰਲੀ ਕਰਨ, ਸਟ੍ਰਾ ਵਰਤਣ ਅਤੇ ਸਿਗਰਟ ਤੋਂ ਬਚੋ, ਕਿਉਂਕਿ ਇਸ ਨਾਲ ਥੱਕਾ ਹਟ ਸਕਦਾ ਹੈ। ਨਰਮ, ਠੰਢਾ ਭੋਜਨ ਲਓ। ਸੋਜ ਕੁਝ ਦਿਨਾਂ ਵਿੱਚ ਘਟ ਜਾਂਦੀ ਹੈ। ਦੰਦ ਦੀ ਥਾਂ ਭਰਨ ਦੀ ਯੋਜਨਾ ਬਣਾਓ।"},
    sutures:{en:"If stitches are placed (more common with surgical or wisdom-tooth removals), they're usually taken out after about 7 to 10 days at a short follow-up visit — unless they're the dissolving kind.",
             hi:"अगर टाँके लगाए जाते हैं (सर्जिकल या अक्ल दाढ़ निकालने में ज़्यादा आम), तो इन्हें आमतौर पर करीब 7 से 10 दिन बाद एक छोटी फ़ॉलो-अप विज़िट में हटाया जाता है — जब तक कि वे अपने-आप घुलने वाले न हों।",
             pa:"ਜੇ ਟਾਂਕੇ ਲਗਾਏ ਜਾਂਦੇ ਹਨ (ਸਰਜੀਕਲ ਜਾਂ ਅਕਲ ਦਾੜ੍ਹ ਕੱਢਣ ਵਿੱਚ ਜ਼ਿਆਦਾ ਆਮ), ਤਾਂ ਇਹਨਾਂ ਨੂੰ ਆਮ ਤੌਰ ਤੇ ਲਗਭਗ 7 ਤੋਂ 10 ਦਿਨ ਬਾਅਦ ਇੱਕ ਛੋਟੀ ਫਾਲੋ-ਅੱਪ ਮੁਲਾਕਾਤ ਵਿੱਚ ਹਟਾਇਆ ਜਾਂਦਾ ਹੈ — ਜਦੋਂ ਤੱਕ ਕਿ ਉਹ ਆਪਣੇ-ਆਪ ਘੁਲਣ ਵਾਲੇ ਨਾ ਹੋਣ।"},
    extra:{en:["Wisdom teeth (the last molars at the back) are often stuck under the gum or bone, so removing them can be a small surgery — the gum is opened and sometimes a little bone is removed.","Expect more swelling, some jaw stiffness, and a longer recovery than a simple extraction — usually settling over about a week.","Lower wisdom teeth sit close to a nerve, so temporary numbness or tingling of the lip, chin or tongue is a specific risk. It's uncommon and usually recovers on its own.","Stitches are commonly placed and removed after about 7 to 10 days.","Use cold packs on the first day, keep the area clean, and follow the aftercare closely to avoid a painful dry socket."],
           hi:["अक्ल दाढ़ (सबसे पीछे की दाढ़) अक्सर मसूड़े या हड्डी के नीचे फँसी होती है, इसलिए इसे निकालना एक छोटी सर्जरी हो सकती है — मसूड़ा खोला जाता है और कभी-कभी थोड़ी हड्डी हटाई जाती है।","सामान्य दाँत निकालने की तुलना में ज़्यादा सूजन, जबड़े में कुछ अकड़न और लंबी रिकवरी हो सकती है — आमतौर पर करीब एक हफ़्ते में ठीक हो जाती है।","नीचे की अक्ल दाढ़ एक नस के पास होती है, इसलिए होंठ, ठुड्डी या जीभ में अस्थायी सुन्नपन या झनझनाहट एक खास जोखिम है। यह कम होता है और आमतौर पर अपने-आप ठीक हो जाता है।","आमतौर पर टाँके लगाए जाते हैं और करीब 7 से 10 दिन बाद हटाए जाते हैं।","पहले दिन ठंडी सिकाई करें, जगह को साफ़ रखें, और दर्दभरे ड्राई सॉकेट से बचने के लिए देखभाल का ध्यान से पालन करें।"],
           pa:["ਅਕਲ ਦਾੜ੍ਹ (ਸਭ ਤੋਂ ਪਿਛਲੀ ਦਾੜ੍ਹ) ਅਕਸਰ ਮਸੂੜੇ ਜਾਂ ਹੱਡੀ ਦੇ ਹੇਠਾਂ ਫਸੀ ਹੁੰਦੀ ਹੈ, ਇਸ ਲਈ ਇਸ ਨੂੰ ਕੱਢਣਾ ਇੱਕ ਛੋਟੀ ਸਰਜਰੀ ਹੋ ਸਕਦੀ ਹੈ — ਮਸੂੜਾ ਖੋਲ੍ਹਿਆ ਜਾਂਦਾ ਹੈ ਅਤੇ ਕਦੇ-ਕਦੇ ਥੋੜ੍ਹੀ ਹੱਡੀ ਹਟਾਈ ਜਾਂਦੀ ਹੈ।","ਆਮ ਦੰਦ ਕੱਢਣ ਦੇ ਮੁਕਾਬਲੇ ਜ਼ਿਆਦਾ ਸੋਜ, ਜਬਾੜੇ ਵਿੱਚ ਕੁਝ ਅਕੜਨ ਅਤੇ ਲੰਮੀ ਰਿਕਵਰੀ ਹੋ ਸਕਦੀ ਹੈ — ਆਮ ਤੌਰ ਤੇ ਲਗਭਗ ਇੱਕ ਹਫ਼ਤੇ ਵਿੱਚ ਠੀਕ ਹੋ ਜਾਂਦੀ ਹੈ।","ਹੇਠਲੀ ਅਕਲ ਦਾੜ੍ਹ ਇੱਕ ਨਸ ਦੇ ਨੇੜੇ ਹੁੰਦੀ ਹੈ, ਇਸ ਲਈ ਬੁੱਲ੍ਹ, ਠੋਡੀ ਜਾਂ ਜੀਭ ਵਿੱਚ ਅਸਥਾਈ ਸੁੰਨਪਨ ਜਾਂ ਝਰਨਾਹਟ ਇੱਕ ਖ਼ਾਸ ਖ਼ਤਰਾ ਹੈ। ਇਹ ਘੱਟ ਹੁੰਦਾ ਹੈ ਅਤੇ ਆਮ ਤੌਰ ਤੇ ਆਪਣੇ-ਆਪ ਠੀਕ ਹੋ ਜਾਂਦਾ ਹੈ।","ਆਮ ਤੌਰ ਤੇ ਟਾਂਕੇ ਲਗਾਏ ਜਾਂਦੇ ਹਨ ਅਤੇ ਲਗਭਗ 7 ਤੋਂ 10 ਦਿਨ ਬਾਅਦ ਹਟਾਏ ਜਾਂਦੇ ਹਨ।","ਪਹਿਲੇ ਦਿਨ ਠੰਢੀ ਸਿਕਾਈ ਕਰੋ, ਥਾਂ ਨੂੰ ਸਾਫ਼ ਰੱਖੋ, ਅਤੇ ਦਰਦ ਭਰੇ ਡ੍ਰਾਈ ਸਾਕਟ ਤੋਂ ਬਚਣ ਲਈ ਦੇਖਭਾਲ ਦਾ ਧਿਆਨ ਨਾਲ ਪਾਲਣ ਕਰੋ।"]}
  },
  {
    id:"flap", icon:"🪡",
    name:{en:"Flap Surgery (Gum Treatment)", hi:"फ्लैप सर्जरी (मसूड़ों का इलाज)", pa:"ਫਲੈਪ ਸਰਜਰੀ (ਮਸੂੜਿਆਂ ਦਾ ਇਲਾਜ)"},
    sub:{en:"Surgery for advanced gum disease", hi:"बढ़ी मसूड़ों की बीमारी की सर्जरी", pa:"ਵਧੀ ਮਸੂੜਿਆਂ ਦੀ ਬਿਮਾਰੀ ਦੀ ਸਰਜਰੀ"},
    what:{en:"When gum disease is advanced and deep cleaning alone can't reach the infection, the gum is gently lifted back (a 'flap') under local anaesthetic to expose the tooth roots and bone. The area is thoroughly cleaned, diseased tissue is removed, the bone may be reshaped or grafted, and the gum is then stitched back into place.",
          hi:"जब मसूड़ों की बीमारी बढ़ जाती है और सिर्फ़ डीप क्लीनिंग से संक्रमण तक नहीं पहुँचा जा सकता, तब लोकल एनेस्थीसिया के तहत मसूड़े को धीरे से ऊपर उठाया जाता है (एक 'फ्लैप') ताकि दाँत की जड़ें और हड्डी दिख सकें। जगह को अच्छी तरह साफ़ किया जाता है, रोगग्रस्त ऊतक हटाया जाता है, ज़रूरत पर हड्डी को दोबारा आकार दिया या ग्राफ्ट किया जाता है, और फिर मसूड़े को टाँके लगाकर वापस जोड़ दिया जाता है।",
          pa:"ਜਦੋਂ ਮਸੂੜਿਆਂ ਦੀ ਬਿਮਾਰੀ ਵਧ ਜਾਂਦੀ ਹੈ ਅਤੇ ਸਿਰਫ਼ ਡੀਪ ਕਲੀਨਿੰਗ ਨਾਲ ਲਾਗ ਤੱਕ ਨਹੀਂ ਪਹੁੰਚਿਆ ਜਾ ਸਕਦਾ, ਤਾਂ ਲੋਕਲ ਬੇਹੋਸ਼ੀ ਦੀ ਦਵਾਈ ਹੇਠ ਮਸੂੜੇ ਨੂੰ ਹੌਲੀ ਨਾਲ ਉੱਪਰ ਚੁੱਕਿਆ ਜਾਂਦਾ ਹੈ (ਇੱਕ 'ਫਲੈਪ') ਤਾਂ ਜੋ ਦੰਦ ਦੀਆਂ ਜੜ੍ਹਾਂ ਅਤੇ ਹੱਡੀ ਦਿੱਸ ਸਕਣ। ਥਾਂ ਨੂੰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਸਾਫ਼ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਰੋਗੀ ਟਿਸ਼ੂ ਹਟਾਇਆ ਜਾਂਦਾ ਹੈ, ਲੋੜ ਤੇ ਹੱਡੀ ਨੂੰ ਦੁਬਾਰਾ ਆਕਾਰ ਦਿੱਤਾ ਜਾਂ ਗ੍ਰਾਫਟ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਫਿਰ ਮਸੂੜੇ ਨੂੰ ਟਾਂਕੇ ਲਗਾ ਕੇ ਵਾਪਸ ਜੋੜ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ।"},
    why:{en:"It treats the deep gum pockets that keep trapping bacteria, cleans the roots properly, and helps stop — and sometimes rebuild — the bone loss that would otherwise loosen and lose your teeth. It's done when non-surgical treatment hasn't controlled the disease.",
         hi:"यह उन गहरी मसूड़ों की पॉकेट का इलाज करता है जिनमें बैक्टीरिया फँसते रहते हैं, जड़ों को ठीक से साफ़ करता है, और उस हड्डी के नुकसान को रोकने — और कभी-कभी दोबारा बनाने — में मदद करता है जिससे दाँत ढीले होकर गिर सकते हैं। यह तब किया जाता है जब बिना सर्जरी वाले इलाज से बीमारी काबू में नहीं आई हो।",
         pa:"ਇਹ ਉਹਨਾਂ ਡੂੰਘੀਆਂ ਮਸੂੜਿਆਂ ਦੀਆਂ ਪਾਕਟਾਂ ਦਾ ਇਲਾਜ ਕਰਦਾ ਹੈ ਜਿਨ੍ਹਾਂ ਵਿੱਚ ਬੈਕਟੀਰੀਆ ਫਸਦੇ ਰਹਿੰਦੇ ਹਨ, ਜੜ੍ਹਾਂ ਨੂੰ ਠੀਕ ਤਰ੍ਹਾਂ ਸਾਫ਼ ਕਰਦਾ ਹੈ, ਅਤੇ ਉਸ ਹੱਡੀ ਦੇ ਨੁਕਸਾਨ ਨੂੰ ਰੋਕਣ — ਅਤੇ ਕਦੇ-ਕਦੇ ਦੁਬਾਰਾ ਬਣਾਉਣ — ਵਿੱਚ ਮਦਦ ਕਰਦਾ ਹੈ ਜਿਸ ਨਾਲ ਦੰਦ ਢਿੱਲੇ ਹੋ ਕੇ ਡਿੱਗ ਸਕਦੇ ਹਨ। ਇਹ ਉਦੋਂ ਕੀਤਾ ਜਾਂਦਾ ਹੈ ਜਦੋਂ ਬਿਨਾਂ ਸਰਜਰੀ ਵਾਲੇ ਇਲਾਜ ਨਾਲ ਬਿਮਾਰੀ ਕਾਬੂ ਵਿੱਚ ਨਾ ਆਈ ਹੋਵੇ।"},
    risks:{en:["Swelling, soreness and some bleeding for a few days","Gums shrink back as they heal, so teeth can look longer and feel more sensitive to hot and cold","Some temporary looseness of the teeth before they firm up again","Infection at the surgical site, though this is uncommon with good care","Results depend partly on your home cleaning and stopping smoking — the disease can return if it isn't maintained"],
           hi:["कुछ दिनों तक सूजन, दर्द और थोड़ा खून आना","ठीक होते समय मसूड़े सिकुड़ते हैं, इसलिए दाँत लंबे दिख सकते हैं और गरम-ठंडे के प्रति ज़्यादा संवेदनशील हो सकते हैं","दाँत दोबारा कसने से पहले कुछ समय अस्थायी ढीलापन","सर्जरी वाली जगह पर संक्रमण, हालांकि अच्छी देखभाल से यह कम होता है","नतीजे कुछ हद तक आपकी घर की सफ़ाई और धूम्रपान छोड़ने पर निर्भर करते हैं — देखभाल न होने पर बीमारी लौट सकती है"],
           pa:["ਕੁਝ ਦਿਨ ਸੋਜ, ਦਰਦ ਅਤੇ ਥੋੜ੍ਹਾ ਖ਼ੂਨ ਆਉਣਾ","ਠੀਕ ਹੁੰਦੇ ਸਮੇਂ ਮਸੂੜੇ ਸੁੰਗੜਦੇ ਹਨ, ਇਸ ਲਈ ਦੰਦ ਲੰਮੇ ਦਿੱਸ ਸਕਦੇ ਹਨ ਅਤੇ ਗਰਮ-ਠੰਢੇ ਪ੍ਰਤੀ ਜ਼ਿਆਦਾ ਸੰਵੇਦਨਸ਼ੀਲ ਹੋ ਸਕਦੇ ਹਨ","ਦੰਦ ਦੁਬਾਰਾ ਕੱਸਣ ਤੋਂ ਪਹਿਲਾਂ ਕੁਝ ਸਮਾਂ ਅਸਥਾਈ ਢਿੱਲਾਪਨ","ਸਰਜਰੀ ਵਾਲੀ ਥਾਂ ਤੇ ਲਾਗ, ਹਾਲਾਂਕਿ ਚੰਗੀ ਦੇਖਭਾਲ ਨਾਲ ਇਹ ਘੱਟ ਹੁੰਦੀ ਹੈ","ਨਤੀਜੇ ਕੁਝ ਹੱਦ ਤੱਕ ਤੁਹਾਡੀ ਘਰ ਦੀ ਸਫ਼ਾਈ ਅਤੇ ਸਿਗਰਟ ਛੱਡਣ ਤੇ ਨਿਰਭਰ ਕਰਦੇ ਹਨ — ਦੇਖਭਾਲ ਨਾ ਹੋਣ ਤੇ ਬਿਮਾਰੀ ਵਾਪਸ ਆ ਸਕਦੀ ਹੈ"]},
    alt:{en:["Non-surgical deep cleaning (scaling and root planing) — tried first, but not enough once the pockets are deep","Removing and replacing the tooth if it's too badly affected to save","Leaving it untreated, which leads to more bone loss and eventual tooth loss"],
         hi:["बिना सर्जरी वाली डीप क्लीनिंग (स्केलिंग और रूट प्लानिंग) — पहले आज़माई जाती है, पर पॉकेट गहरी होने पर पर्याप्त नहीं","अगर दाँत बचाने लायक न बचा हो तो उसे निकालकर उसकी जगह भरना","बिना इलाज छोड़ना, जिससे और हड्डी घटती है और अंततः दाँत गिर जाते हैं"],
         pa:["ਬਿਨਾਂ ਸਰਜਰੀ ਵਾਲੀ ਡੀਪ ਕਲੀਨਿੰਗ (ਸਕੇਲਿੰਗ ਅਤੇ ਰੂਟ ਪਲੈਨਿੰਗ) — ਪਹਿਲਾਂ ਅਜ਼ਮਾਈ ਜਾਂਦੀ ਹੈ, ਪਰ ਪਾਕਟਾਂ ਡੂੰਘੀਆਂ ਹੋਣ ਤੇ ਕਾਫ਼ੀ ਨਹੀਂ","ਜੇ ਦੰਦ ਬਚਾਉਣ ਲਾਇਕ ਨਾ ਬਚਿਆ ਹੋਵੇ ਤਾਂ ਉਸ ਨੂੰ ਕੱਢ ਕੇ ਉਸ ਦੀ ਥਾਂ ਭਰਨਾ","ਬਿਨਾਂ ਇਲਾਜ ਛੱਡਣਾ, ਜਿਸ ਨਾਲ ਹੋਰ ਹੱਡੀ ਘਟਦੀ ਹੈ ਅਤੇ ਅੰਤ ਵਿੱਚ ਦੰਦ ਡਿੱਗ ਜਾਂਦੇ ਹਨ"]},
    rec:{en:"Expect some swelling and soreness for a few days — cold packs and the prescribed painkillers help. Stick to soft, cool foods and chew away from the surgery site. Keep your mouth clean as instructed (often with a special mouth rinse), but don't brush directly over the stitches until you're told it's safe. Most people are back to normal within about a week to ten days.",
         hi:"कुछ दिनों तक सूजन और दर्द रह सकता है — ठंडी सिकाई और बताई गई दर्दनिवारक दवाएँ मदद करती हैं। नरम, ठंडा भोजन लें और सर्जरी वाली जगह से दूर चबाएँ। बताए अनुसार मुँह साफ़ रखें (अक्सर एक खास माउथ रिंस से), पर जब तक सुरक्षित न बताया जाए, टाँकों पर सीधे ब्रश न करें। ज़्यादातर लोग करीब एक हफ़्ते से दस दिन में सामान्य हो जाते हैं।",

var SigPad = (function(){
  var canvas=document.getElementById("sigpad"), ctx=null, drawing=false, hasInk=false, last=null;
  function setup(){
    var r=canvas.getBoundingClientRect(); if(!r.width) return;
    var dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(180*dpr);
    ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
    ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#12303a";
  }
  function pos(e){ var r=canvas.getBoundingClientRect(); var t=(e.touches&&e.touches[0])?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
  function start(e){ if(!ctx) setup(); e.preventDefault(); drawing=true; last=pos(e); }
  function move(e){ if(!drawing||!ctx) return; e.preventDefault(); var pt=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(pt.x,pt.y); ctx.stroke(); last=pt; if(!hasInk){ hasInk=true; canvas.classList.add("signed"); refreshGate(); } }
  function end(){ drawing=false; }
  canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false}); canvas.addEventListener("touchend",end);
  return {
    resize:function(){ if(!hasInk) setup(); },
    clear:function(){ if(ctx) ctx.clearRect(0,0,canvas.width,canvas.height); hasInk=false; canvas.classList.remove("signed"); refreshGate(); },
    isSigned:function(){ return hasInk; },
    dataURL:function(){ return canvas.toDataURL("image/png"); }
  };
})();

function makePdfBase64(){
  var node=document.getElementById("pdfDoc");
  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  return ready.then(function(){ return html2canvas(node,{scale:2,backgroundColor:"#ffffff"}); }).then(function(canvas){
    var img=canvas.toDataURL("image/png");
    var JsPDF=window.jspdf.jsPDF;
    var pdf=new JsPDF("p","mm","a4");
    var pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    var iw=pw, ih=canvas.height*(pw/canvas.width);
    var left=ih, y=0;
    pdf.addImage(img,"PNG",0,y,iw,ih); left-=ph;
    while(left>0){ y=left-ih; pdf.addPage(); pdf.addImage(img,"PNG",0,y,iw,ih); left-=ph; }
    return pdf.output("datauristring").split(",")[1];
  });
}

  var g=document.getElementById("gateHint"); g.classList.remove("show");
  if(!window.jspdf || !window.jspdf.jsPDF || typeof html2canvas==="undefined"){
    g.textContent="PDF tools didn't load — check the internet connection or any ad-blocker, then try again."; g.classList.add("show"); return;
  }
  btn.disabled=true; btn.innerHTML=SENDING[lang];
  var step="pdf";
  Promise.resolve().then(function(){ buildPdfDom(p); return makePdfBase64(); }).then(function(b64){
    step="send";
    var payload={ pdf:b64, filename:"consent-"+((name.replace(/[^a-z0-9]+/gi,"_"))||"patient")+".pdf",
      patientName:name, phone:phone, procedure:t(p.name), procedureEn:p.name.en, language:LANGNAME[lang], questions:(document.getElementById("qbox").value||"").trim(), when:new Date().toISOString() };
    return fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  }).then(function(res){
    return res.text().then(function(txt){ if(!res.ok) throw new Error("Server "+res.status+": "+txt); return txt; });
  }).then(function(){
    document.getElementById("signSection").style.display="none";
    var d=document.getElementById("doneCard"); d.classList.add("show"); d.scrollIntoView({behavior:"smooth",block:"center"});
  }).catch(function(err){
    btn.disabled=false; btn.innerHTML=origText;
    g.textContent=(step==="pdf"?"PDF error: ":"Send error: ")+((err&&err.message)||err); g.classList.add("show");
  });
}
document.getElementById("submitBtn").addEventListener("click",submitConsent);
/* =============== end signing =============== */

document.getElementById('langSelect').value = lang;
applyStaticLang();
renderPicker();
</script>
</body>
</html>
